name: Recoge los tiempos de cola de PortAventura

on:
  schedule:
    # GitHub usa UTC.
    # 08:30 UTC = 10:30 hora Madrid en horario de verano.
    - cron: "30 4 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests

      # ======================================================
      # RECOPILACIÓN CONTINUA
      # ======================================================

      - name: Recopilar cada 15 minutos
        env:
          PARK_QUEUE_TIMES_API_KEY: ${{ secrets.PARK_QUEUE_TIMES_API_KEY }}
        run: |

          python3 <<'PY'

          import subprocess
          import time
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Madrid")

          CLOSING = 23 * 60 + 30

          def current_minutes():

              now = datetime.now(TZ)

              return (
                  now.hour * 60
                  + now.minute
              )

          print("==========================================")
          print("PORTAVENTURA QUEUE STUDY")
          print("SCHEDULER CONTINUO")
          print("==========================================")

          while True:

              now = datetime.now(TZ)

              current = (
                  now.hour * 60
                  + now.minute
              )

              print("")
              print("------------------------------------------")
              print(
                  "Hora Madrid:",
                  now.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  )
              )


              # ==================================================
              # DESPUÉS DE LAS 23:30
              # ==================================================

              if current >= CLOSING:

                  print(
                      "Son las 23:30 o más."
                  )

                  print(
                      "Finalizando workflow."
                  )

                  break

              # ==================================================
              # EJECUTAR COLLECTOR
              # ==================================================

              print(
                  "Ejecutando collector.py..."
              )

              result = subprocess.run(
                  [
                      "python",
                      "collector.py"
                  ],
                  env=os.environ.copy()
              )

              if result.returncode == 0:

                  print(
                      "Collector ejecutado correctamente."
                  )

              else:

                  print(
                      "ERROR: collector.py terminó con código",
                      result.returncode
                  )

              # ==================================================
              # GUARDAR CSV INMEDIATAMENTE
              # ==================================================

              print(
                  "Guardando datos en GitHub..."
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "PortAventura Queue Bot"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "bot@portaventura-queue-study.local"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "add",
                      "data/queue_history.csv"
                  ],
                  check=False
              )

              status = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )

              if status.returncode != 0:

                  subprocess.run(
                      [
                          "git",
                          "commit",
                          "-m",
                          "Collect queue data"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "pull",
                          "--rebase",
                          "origin",
                          "main"
                      ],
                      check=True
                  )

                  subprocess.run(
                      [
                          "git",
                          "push",
                          "origin",
                          "main"
                      ],
                      check=True

                  )

                  print(
                      "Datos guardados correctamente."
                  )

              else:

                  print(
                      "No hay cambios nuevos que guardar."
                  )

              # ==================================================
              # ESPERAR 15 MINUTOS
              # ==================================================

              print(
                  "Esperando 15 minutos..."
              )

              for second in range(900):

                  time.sleep(1)

                  now = datetime.now(TZ)

                  current = (
                      now.hour * 60
                      + now.minute
                  )

                  if current >= CLOSING:

                      print(
                          "Se alcanzó el horario de cierre."
                      )

                      print(
                          "Finalizando workflow."
                      )

                      raise SystemExit(0)

          PY

      # ======================================================
      # FINAL
      # ======================================================

      - name: Workflow terminado
        if: always()
        run: |
          echo "=========================================="
          echo "RECOPILACIÓN DIARIA FINALIZADA"
          echo "=========================================="

name: Recoge los tiempos de cola de PortAventura

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Recopilar datos
        env:
          PARK_QUEUE_TIMES_API_KEY: ${{ secrets.PARK_QUEUE_TIMES_API_KEY }}
        run: |
          python collector.py

      - name: Guardar datos en GitHub
        run: |
          git config user.name "PortAventura Queue Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/queue_history.csv

          if git diff --cached --quiet; then
            echo "No hay datos nuevos para guardar."
            exit 0
          fi

          git commit -m "Collect queue data"

          git pull --rebase origin main

          git push origin main

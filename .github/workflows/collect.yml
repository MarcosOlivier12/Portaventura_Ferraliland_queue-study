name: Recoge los tiempos de cola de PortAventura

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  recolectar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Comprobar horario de PortAventura
        id: horario
        run: |
          HORA=$(TZ=Europe/Madrid date +%H:%M)

          echo "Hora Madrid: $HORA"

          if [[ "$HORA" > "10:29" && "$HORA" < "23:31" ]]; then
            echo "dentro_horario=true" >> "$GITHUB_OUTPUT"
            echo "PortAventura está dentro del horario de recopilación."
          else
            echo "dentro_horario=false" >> "$GITHUB_OUTPUT"
            echo "Fuera del horario de recopilación."
          fi

      - name: Recopilar datos
        if: steps.horario.outputs.dentro_horario == 'true'
        env:
          PARK_QUEUE_TIMES_API_KEY: ${{ secrets.PARK_QUEUE_TIMES_API_KEY }}
        run: |
          python collector.py

      - name: Guardar datos en GitHub
        if: steps.horario.outputs.dentro_horario == 'true'
        run: |
          git config user.name "PortAventura Queue Bot"
          git config user.email "bot@portaventura-queue-study.local"

          git add data/queue_history.csv

          if git diff --cached --quiet; then
            echo "No hay cambios en queue_history.csv."
            exit 0
          fi

          git commit -m "Collect queue data"

          git pull --rebase origin main

          git push origin main
